<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f0f1a; }
      body { font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
      .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .bg-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%); opacity: 0; }
      h1 { font-size: 80px; font-weight: 800; color: #fff; letter-spacing: -2px; opacity: 0; }
      h1 span { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .sub { font-size: 28px; color: #94a3b8; margin-top: 24px; font-weight: 400; opacity: 0; }
      .badge { margin-top: 40px; padding: 10px 28px; border-radius: 9999px; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); font-size: 16px; color: #a5b4fc; font-weight: 500; opacity: 0; }
      .bar { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 200px; height: 4px; border-radius: 2px; background: rgba(99,102,241,0.2); overflow: hidden; }
      .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #818cf8, #c084fc); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-gxr6" id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

      <div data-hf-id="hf-nt1x" class="slide" id="slide1">
        <div data-hf-id="hf-nfp0" class="bg-glow" id="glow"></div>
        <h1 data-hf-id="hf-j7ph" id="title">Gaya <span data-hf-id="hf-ijtm">Agent</span></h1>
        <p data-hf-id="hf-28f1" class="sub" id="subtitle">HyperFrames · Video Composition Test</p>
        <div data-hf-id="hf-42qi" class="badge" id="badge">✦ HTML → MP4</div>
        <div data-hf-id="hf-ufsv" class="bar"><div data-hf-id="hf-azhs" class="bar-fill" id="progress"></div></div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 8;

      // Initial glow reveal (no overlap with pulse — use separate property)
      tl.from("#glow", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      // Pulse: finite repeat (DUR / 2.5 ≈ 3 cycles → 2 repeats)
      tl.to("#glow", { scale: 1.3, opacity: 0.5, duration: 2.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.3);

      tl.from("#title", { opacity: 0, y: -40, duration: 1, ease: "power3.out" }, 0.3);
      tl.from("#subtitle", { opacity: 0, y: 20, duration: 0.8, ease: "power2.out" }, 0.9);
      tl.from("#badge", { opacity: 0, scale: 0.8, duration: 0.6, ease: "back.out(1.7)" }, 1.3);
      tl.to("#progress", { width: "100%", duration: 5, ease: "none" }, 2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
