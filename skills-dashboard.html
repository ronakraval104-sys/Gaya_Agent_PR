<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaya — Skills Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   RESET + ROOT
   ══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e14;
  --bg-panel: #111820;
  --bg-card: #16202a;
  --border: #1e3040;
  --text: #c8d6e0;
  --text-dim: #6a8090;
  --process: #38bdf8;
  --process-dim: #006080;
  --quality: #fbbf24;
  --quality-dim: #806010;
  --creation: #a78bfa;
  --creation-dim: #503080;
  --dev: #34d399;
  --dev-dim: #166534;
  --business: #f472b6;
  --business-dim: #802050;
  --special: #fb923c;
  --special-dim: #804010;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated grid */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px 24px 60px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ══════════════════════════════════════
   HEADER
   ══════════════════════════════════════ */
header {
  text-align: center;
  padding: 40px 0 20px;
  opacity: 0;
  animation: fadeSlideDown 0.8s ease forwards;
}

header h1 {
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 50%, #34d399 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

header .subtitle {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-top: 8px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.7;
}

.status-bar {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
}

.status-item {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
  animation: pulse 2s ease-in-out infinite;
}
.dot.green { background: var(--dev); }

/* ══════════════════════════════════════
   STATS ROW
   ══════════════════════════════════════ */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 16px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeSlideDown 0.8s ease 0.3s forwards;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 24px;
  text-align: center;
  min-width: 90px;
}

.stat-card .stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1.2;
  color: var(--creation);
}

.stat-card .stat-label {
  font-size: 0.6rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

/* ══════════════════════════════════════
   LEGEND
   ══════════════════════════════════════ */
.legend {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeSlideDown 0.8s ease 0.5s forwards;
}

.legend-item {
  font-size: 0.65rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.legend-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* ══════════════════════════════════════
   CONTROLS
   ══════════════════════════════════════ */
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeSlideDown 0.8s ease 0.6s forwards;
}

.srch-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  transition: border .2s;
  flex: 1;
  min-width: 180px;
  max-width: 300px;
}

.srch-wrap:focus-within { border-color: rgba(167,139,250,0.4); }
.srch-wrap svg { flex-shrink: 0; opacity: 0.4; }

.srch-wrap input {
  background: none; border: none; outline: none;
  color: var(--text); font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  width: 100%;
}
.srch-wrap input::placeholder { color: var(--text-dim); opacity: 0.5; }

.cnt-bdg {
  font-size: 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  white-space: nowrap;
}

.filters {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.fbtn {
  font-size: 0.65rem;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  user-select: none;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.fbtn:hover { border-color: rgba(167,139,250,0.3); color: var(--text); }
.fbtn.on { background: rgba(167,139,250,0.15); border-color: rgba(167,139,250,0.35); color: #a78bfa; }
.fbtn-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* ══════════════════════════════════════
   SKILL GRID
   ══════════════════════════════════════ */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
  margin-top: 20px;
}

/* ══════════════════════════════════════
   SKILL CARD
   ══════════════════════════════════════ */
.skill-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.skill-card.visible {
  opacity: 1;
  transform: translateY(0);
}

.skill-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  border-color: var(--text-dim);
}

/* Colored top border */
.skill-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.skill-card.process::before { background: linear-gradient(90deg, var(--process), var(--process-dim)); }
.skill-card.quality::before { background: linear-gradient(90deg, var(--quality), var(--quality-dim)); }
.skill-card.creation::before { background: linear-gradient(90deg, var(--creation), var(--creation-dim)); }
.skill-card.dev::before { background: linear-gradient(90deg, var(--dev), var(--dev-dim)); }
.skill-card.business::before { background: linear-gradient(90deg, var(--business), var(--business-dim)); }
.skill-card.special::before { background: linear-gradient(90deg, var(--special), var(--special-dim)); }

.skill-card-inner {
  padding: 18px;
}

/* Card header row */
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.skill-icon {
  font-size: 1.5rem;
  line-height: 1;
  flex-shrink: 0;
}

.skill-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.skill-type-badge {
  font-size: 0.5rem;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

/* Category tag */
.card-tag-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.skill-tag {
  font-size: 0.55rem;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Description (visible when collapsed) */
.skill-desc {
  font-size: 0.78rem;
  color: var(--text);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  opacity: 0.8;
}

/* ══════════════════════════════════════
   EXPANDED CONTENT
   ══════════════════════════════════════ */
.expand-wrap {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.skill-card.expanded .expand-wrap {
  max-height: 800px;
}

.expand-content {
  padding: 0 18px 18px;
  border-top: 1px solid rgba(30,48,64,0.3);
  margin-top: 12px;
  padding-top: 14px;
}

/* Expanded description */
.expand-desc {
  font-size: 0.78rem;
  line-height: 1.7;
  color: var(--text);
  opacity: 0.85;
  margin-bottom: 14px;
}

/* Workflow example */
.expand-workflow {
  background: rgba(167,139,250,0.05);
  border: 1px solid rgba(167,139,250,0.1);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
  position: relative;
}

.expand-workflow::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}

.expand-workflow-title {
  font-size: 0.55rem;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 6px;
  opacity: 0.7;
}

.expand-workflow-text {
  font-size: 0.75rem;
  line-height: 1.7;
  font-style: italic;
  opacity: 0.85;
}

/* Related skills */
.expand-related {
  margin-bottom: 14px;
}

.expand-related-title {
  font-size: 0.55rem;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 6px;
  opacity: 0.7;
}

.expand-related-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.expand-related-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 5px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s;
  font-size: 0.7rem;
  color: var(--text-dim);
}

.expand-related-chip:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(167,139,250,0.25);
  color: var(--text);
}

.expand-related-chip-icon { font-size: 0.9rem; flex-shrink: 0; }
.expand-related-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tags + Path row */
.expand-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-start;
}

.expand-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  flex: 1;
}

.expand-tag {
  font-size: 0.55rem;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--text-dim);
}

.expand-path {
  font-size: 0.6rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  word-break: break-all;
  background: rgba(0,0,0,0.2);
  padding: 4px 8px;
  border-radius: 4px;
  opacity: 0.6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Expand hint */
.expand-hint {
  padding: 8px 18px;
  font-size: 0.65rem;
  color: var(--text-dim);
  text-align: center;
  border-top: 1px solid rgba(30,48,64,0.2);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
  opacity: 0.5;
  transition: opacity 0.3s;
}

.skill-card:hover .expand-hint { opacity: 0.8; }
.skill-card.expanded .expand-hint { opacity: 0.3; }

/* ══════════════════════════════════════
   EMPTY STATE
   ══════════════════════════════════════ */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  grid-column: 1 / -1;
}

.empty-state.visible { display: flex; }

.empty-state p {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

/* ══════════════════════════════════════
   FOOTER
   ══════════════════════════════════════ */
footer {
  margin-top: 40px;
  text-align: center;
  padding: 30px;
  font-size: 0.75rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  animation: fadeSlideDown 0.8s ease 1.2s forwards;
}

footer .note {
  margin-top: 4px;
  font-size: 0.65rem;
  opacity: 0.6;
}

/* ══════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════ */
@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ══════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════ */
@media (max-width: 900px) {
  header h1 { font-size: 1.8rem; }
  .skill-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .expand-related-grid { grid-template-columns: 1fr; }
}

@media (max-width: 500px) {
  header h1 { font-size: 1.4rem; }
  .skill-grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; align-items: stretch; }
  .srch-wrap { max-width: 100%; }
  .filters { justify-content: center; }
}
</style>
</head>
<body>

<div class="container">

  <!-- ═══ HEADER ═══ -->
  <header>
    <h1>⚔ GAYA SKILL HANDBOOK</h1>
    <div class="subtitle">37 Modules · 21 Custom · 14 Superpowers · 2 Bonus</div>
    <div class="status-bar">
      <span class="status-item"><span class="dot green"></span> Skills Ready</span>
      <span class="status-item">🕒 <span id="dateDisplay"></span></span>
      <span class="status-item">▼ Click to expand</span>
    </div>
  </header>

  <!-- ═══ STATS ═══ -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value"><span class="count-up" data-target="37">0</span></div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--dev)"><span class="count-up" data-target="21">0</span></div>
      <div class="stat-label">Custom</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--process)"><span class="count-up" data-target="14">0</span></div>
      <div class="stat-label">Superpowers</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--quality)"><span class="count-up" data-target="2">0</span></div>
      <div class="stat-label">Bonus</div>
    </div>
  </div>

  <!-- ═══ LEGEND ═══ -->
  <div class="legend" id="legend"></div>

  <!-- ═══ CONTROLS ═══ -->
  <div class="controls">
    <div class="srch-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Search…" spellcheck="false" autocomplete="off">
    </div>
    <div class="cnt-bdg"><span id="vcount">0</span> / <span id="vtotal">0</span></div>
    <div class="filters" id="filters"></div>
  </div>

  <!-- ═══ SKILL GRID ═══ -->
  <div class="skill-grid" id="grid">
    <div class="empty-state" id="emptyState">
      <p>◈ No skills match your search</p>
    </div>
  </div>

  <!-- ═══ FOOTER ═══ -->
  <footer>
    <div>BUILD 2026.06.25 · Gaya Skill System</div>
    <div class="note">Click any card to expand · Search · Filter by category</div>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
const SKILLS = {
  // Superpowers: Process
  "sbr": { n:"Brainstorming", i:"💡", c:"process", t:"Superpowers",
    d:"Socratic design refinement. Explore intent, requirements, and edge cases through structured dialogue before any implementation.",
    ex:"Before writing any code for a new feature, invoke Brainstorming first — it explores the user's intent, requirements, edge cases, and design tradeoffs through structured dialogue so you never build the wrong thing.",
    r:["swp","sgm","sba","std"], p:"skills/brainstorming/", g:["planning","design","spec","dialogue"] },
  "swp":{ n:"Writing Plans", i:"📝", c:"process", t:"Superpowers",
    d:"Bite-sized plans from specs. Exact file paths, code snippets, and shell commands. No TBDs.",
    ex:"After a brainstorming session resolves the 'what', convert the spec into a structured implementation plan with exact file paths, code snippets, and shell commands — no TBDs or ambiguity allowed.",
    r:["sbr","sep","std","sdp"], p:"skills/writing-plans/", g:["planning","spec","implementation"] },
  "std":{ n:"TDD", i:"🔄", c:"process", t:"Superpowers",
    d:"Red-Green-Refactor. No implementation without a failing test first. The test is living documentation.",
    ex:"Write a failing test first (Red), then minimum code to pass (Green), then refactor safely. The test stays as living documentation forever.",
    r:["swp","svb","srq","sdb"], p:"skills/test-driven-development/", g:["testing","tdd","discipline"] },
  "sep":{ n:"Executing Plans", i:"▶", c:"process", t:"Superpowers",
    d:"Runs plans with checkpoints, intermediate verification, and handoff to Finish Branch.",
    ex:"After Writing Plans produces a step-by-step spec, dispatch it to Executing Plans — it runs each step with checkpoints, verifies intermediate outputs, and hands off to Finish Branch when complete.",
    r:["swp","sfc","svb","sdp"], p:"skills/executing-plans/", g:["execution","checkpoints","verification"] },
  "sgw":{ n:"Git Worktrees", i:"🌿", c:"process", t:"Superpowers",
    d:"Isolated workspaces per branch. No stashing, no context switching.",
    ex:"Juggle a hotfix on main alongside a feature branch — check out each branch in its own directory with no stashing, no switching, no context loss.",
    r:["sfc","sep","sdp"], p:"skills/using-git-worktrees/", g:["git","worktree","isolation"] },
  "sdp":{ n:"Dispatch Parallel", i:"⚡", c:"process", t:"Superpowers",
    d:"Split 2+ independent tasks into parallel subagent work. 2× throughput.",
    ex:"When a feature has independent frontend and backend work, spawn two subagents simultaneously — no shared state, no conflicts, 2× throughput.",
    r:["ssd","sep","swp"], p:"skills/dispatching-parallel-agents/", g:["parallel","subagent","efficiency"] },
  "sba":{ n:"Brainstorming Alt", i:"🧠", c:"process", t:"Superpowers",
    d:"Alternate brainstorming: diverge → converge → commit. Great for creative blocks.",
    ex:"When stuck on a design decision, first diverge (generate many ideas), then converge (narrow to one), then commit.",
    r:["sbr","swp","sgm"], p:"skills/brainstorming/", g:["planning","design","alternative"] },
  "ssd":{ n:"Subagent Dev", i:"🤖", c:"process", t:"Superpowers",
    d:"Fresh subagent per task with two-stage spec + quality review. Focused and verifiable.",
    ex:"For a complex multi-file feature, spawn a dedicated subagent per file with a spec stage (describe intent) and quality stage (review output).",
    r:["sdp","srq","swp","sep"], p:"skills/subagent-driven-development/", g:["subagent","parallel","review"] },

  // Superpowers: Quality
  "srq":{ n:"Request Review", i:"👁", c:"quality", t:"Superpowers",
    d:"Code reviewer subagent. Classifies issues: Critical → Important → Minor.",
    ex:"After completing implementation, spawn a reviewer subagent — it reads the diff, classifies issues as Critical (must fix), Important (should fix), or Minor (note only).",
    r:["src","std","svb","sfc"], p:"skills/requesting-code-review/", g:["review","code-quality","feedback"] },

const SKILL_IDS = Object.keys(SKILLS);

const CAT = {
  process:{clr:"#38bdf8",lbl:"Process"},
  quality:{clr:"#fbbf24",lbl:"Quality"},
  creation:{clr:"#a78bfa",lbl:"Creation"},
  dev:{clr:"#34d399",lbl:"Dev"},
  business:{clr:"#f472b6",lbl:"Business"},
  special:{clr:"#fb923c",lbl:"Specialist"}
};
const CAT_KEYS = Object.keys(CAT);

// ═══ DATE ═══
document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

// ═══ LEGEND ═══
(function(){
  let h='';
  for(const k of CAT_KEYS) h+=`<span class="legend-item"><span class="legend-dot" style="background:${CAT[k].clr}"></span>${CAT[k].lbl}</span>`;
  h+=`<span class="legend-item"><span class="legend-dot" style="background:rgba(255,255,255,0.3)"></span>Superpowers</span>`;
  h+=`<span class="legend-item"><span class="legend-dot" style="background:rgba(255,255,255,0.15)"></span>Custom</span>`;
  document.getElementById('legend').innerHTML=h;
})();

// ═══ RENDER ═══
const grid=document.getElementById('grid');
const vcount=document.getElementById('vcount'), vtotal=document.getElementById('vtotal');
const searchInput=document.getElementById('search'), filtersEl=document.getElementById('filters');
let activeFilter='all', searchQ='';

function catColor(c){return CAT[c]?CAT[c].clr:'#64748b';}

function render(){
  let html='', vis=0;

  for(const id of SKILL_IDS){
    const s=SKILLS[id];
    let show=true;
    if(activeFilter!=='all'){
      if(activeFilter==='superpowers'&&s.t!=='Superpowers')show=false;
      else if(activeFilter==='custom'&&s.t!=='Custom')show=false;
      else if(activeFilter!=='superpowers'&&activeFilter!=='custom'&&s.c!==activeFilter)show=false;
    }
    if(show&&searchQ){
      const q=searchQ.toLowerCase();
      if(!s.n.toLowerCase().includes(q)&&!s.d.toLowerCase().includes(q)&&!s.g.some(g=>g.includes(q)))show=false;
    }
    if(!show)continue;
    vis++;

    const clr=catColor(s.c);

    // Related skills HTML
    let relHtml='';
    if(s.r&&s.r.length){
      relHtml+='<div class="expand-related"><div class="expand-related-title">Related Skills</div><div class="expand-related-grid">';
      for(const rid of s.r){
        const rs=SKILLS[rid];
        if(rs) relHtml+=`<div class="expand-related-chip" data-id="${rid}"><span class="expand-related-chip-icon">${rs.i}</span><span class="expand-related-chip-name">${rs.n}</span></div>`;
      }
      relHtml+='</div></div>';
    }

    // Tags HTML
    let tagsHtml='';
    if(s.g&&s.g.length){
      tagsHtml=s.g.map(g=>`<span class="expand-tag">${g}</span>`).join('');
    }

    // Path
    const pathHtml=`<span class="expand-path">${s.p}</span>`;

    // Workflow example
    const wfColor=clr;
    const wfHtml=s.ex?`<div class="expand-workflow" style="border-color:${wfColor}40"><div class="expand-workflow-title">Workflow Example</div><div class="expand-workflow-text" style="color:${wfColor}bb">${s.ex}</div></div>`:'';

    html+=`<div class="skill-card ${s.c}" data-id="${id}" tabindex="0" role="button" aria-label="${s.n}">
      <div class="skill-card-inner">
        <div class="card-header">
          <span class="skill-icon">${s.i}</span>
          <span class="skill-name">${s.n}</span>
          <span class="skill-type-badge">${s.t}</span>
        </div>
        <div class="card-tag-row">
          <span class="skill-tag" style="background:${clr}18;color:${clr}">${s.c}</span>
        </div>
        <div class="skill-desc">${s.d}</div>
      </div>
      <div class="expand-wrap">
        <div class="expand-content">
          <div class="expand-desc">${s.d}</div>
          ${wfHtml}
          ${relHtml}
          <div class="expand-meta">
            ${tagsHtml?`<div class="expand-tags">${tagsHtml}</div>`:''}
            ${pathHtml}
          </div>
        </div>
      </div>
      <div class="expand-hint">▼ Click to expand details</div>
    </div>`;
  }

  const emptyHtml=vis===0?'<div class="empty-state visible"><p>◈ No skills match your search</p></div>':'';
  grid.innerHTML=html+emptyHtml;
  vcount.textContent=vis;
  vtotal.textContent=SKILL_IDS.length;

  // Card click to expand
  document.querySelectorAll('.skill-card').forEach(el=>{
    el.addEventListener('click',()=>{
      el.classList.toggle('expanded');
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.classList.toggle('expanded')}});
  });

  // Related chip clicks
  document.querySelectorAll('.expand-related-chip').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const id=el.dataset.id;
      // Find the card with this id and scroll to it
      const targetCard=document.querySelector(`.skill-card[data-id="${id}"]`);
      if(targetCard){
        targetCard.scrollIntoView({behavior:'smooth',block:'center'});
        targetCard.classList.add('expanded');
      }
    });
  });

  // Entrance animation
  const cards=document.querySelectorAll('.skill-card');
  cards.forEach((card,i)=>{setTimeout(()=>{card.classList.add('visible')},100+i*40)});
}

// ═══ FILTERS ═══
function buildFilters(){
  let h='<button class="fbtn on" data-f="all">All</button>';
  h+='<button class="fbtn" data-f="superpowers">★ Superpowers</button>';
  h+='<button class="fbtn" data-f="custom">● Custom</button>';
  h+='<span style="width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0"></span>';
  for(const c of CAT_KEYS) h+=`<button class="fbtn" data-f="${c}"><span class="fbtn-dot" style="background:${CAT[c].clr}"></span>${CAT[c].lbl}</button>`;
  filtersEl.innerHTML=h;
  filtersEl.querySelectorAll('.fbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      filtersEl.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('on',x===b));
      activeFilter=b.dataset.f;
      render();
    });
  });
}

// ═══ SEARCH ═══
searchInput.addEventListener('input',()=>{searchQ=searchInput.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){searchInput.focus();e.preventDefault()}});

// ═══ COUNT-UP ═══
function animateCounter(el,target){
  const d=1200,s=performance.now();
  function update(now){
    const p=Math.min((now-s)/d,1),cur=Math.floor((1-Math.pow(1-p,3))*target);
    el.textContent=cur;
    if(p<1)requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}
const cuObs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){const t=parseFloat(e.target.dataset.target);animateCounter(e.target,t);cuObs.unobserve(e.target)}});
},{threshold:0.3});
document.querySelectorAll('.count-up').forEach(c=>cuObs.observe(c));

// ═══ GO ═══
buildFilters();
render();
</script>
